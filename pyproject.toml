[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zwift-client"
version = "0.2.1.dev0"
description = "Zwift Mobile API client."
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Sander Smits", email = "jhmsmits@gmail.com"},
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
keywords = ["zwift"]
dependencies = [
    "protobuf",
    "requests",
]

[project.urls]
Homepage = "https://github.com/jsmits/zwift-client"

[tool.hatch.build.targets.wheel]
packages = ["zwift"]

[tool.hatch.version]
path = "zwift/__init__.py"

[tool.flake8]
exclude = ["docs", "zwift/zwift_messages_pb2.py"]
